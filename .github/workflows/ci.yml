name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test dashboard queries
        run: npm test

      - name: Test Jev review package
        run: |
          npm ci --ignore-scripts --prefix scripts/jev-review
          npm test --prefix scripts/jev-review

      - name: Build
        run: npm run build
