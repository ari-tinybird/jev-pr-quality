name: Jev Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: jev-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: rawtreedb/jev-pr-quality@main
        with:
          jev-api-key: ${{ secrets.JEV_API_KEY }}
          minimum-score: ${{ vars.JEV_MIN_SCORE || '7' }}
          rawtree-api-key: ${{ secrets.RAWTREE_JEV_API_KEY }}
          rawtree-database: ${{ vars.RAWTREE_JEV_DATABASE }}
